[project]
name = "minuano-collector"
version = "0.0.1"
description = "minuano event collector — raw collection, no enrichment"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Dependencies are added only by explicit decision. The validation harness uses the
# standard library on purpose, so that testing the collector needs no test-only
# dependency -- the S3 client is injected instead of mocked with a library.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jsonschema>=4.23",
    "fsspec>=2025.1",  # increment 4, the sink. Local and every cloud become one code path.
    "duckdb>=1.5.5",   # increment 3, the query layer. Reads the NDJSON in place; SQL ports to Athena.
]

# One extra per cloud, so a base install carries no cloud SDK at all. The backends bring their
# own credential chains -- instance roles, workload identity, managed identity -- which is the
# reason not to write our own.
[project.optional-dependencies]
aws = ["s3fs>=2025.1"]      # s3://    -- also Cloudflare R2, MinIO, Backblaze, via endpoint config
gcp = ["gcsfs>=2025.1"]     # gs://
azure = ["adlfs>=2024.7"]   # az://    -- Azure Blob and ADLS Gen2

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]
