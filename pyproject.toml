[project]
name = "minuano-collector"
version = "0.0.1"
description = "minuano event collector — raw collection, no enrichment"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Dependencies are added only by explicit decision. The validation harness uses the
# standard library on purpose, so that testing the collector needs no test-only
# dependency -- the S3 client is injected instead of mocked with a library.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jsonschema>=4.23",
    "boto3>=1.35",       # increment 2, S3 sink. Imported lazily; the local path never loads it.
    "duckdb>=1.5.5",  # increment 3, the local query layer. Reads the NDJSON in place; SQL ports to Athena.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]
